<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting Summarizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14161B;
    --ink-raised: #1D2027;
    --paper: #ECE9E2;
    --paper-dim: #9A9C9E;
    --amber: #E8A33D;
    --amber-dim: #6B5327;
    --line: #2C303A;
    --good: #7FB88A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 24px 96px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 8px;
  }

  .rec-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 0 0 rgba(232,163,61,0.6);
    animation: pulse 2.4s infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(232,163,61,0.5); }
    70%  { box-shadow: 0 0 0 10px rgba(232,163,61,0); }
    100% { box-shadow: 0 0 0 0 rgba(232,163,61,0); }
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .sub {
    color: var(--paper-dim);
    font-size: 14.5px;
    margin: 0 0 40px 24px;
    line-height: 1.5;
  }

  .panel {
    background: var(--ink-raised);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px;
    margin-bottom: 20px;
  }

  .drop {
    border: 1.5px dashed var(--line);
    border-radius: 10px;
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .drop:hover, .drop.drag {
    border-color: var(--amber);
    background: rgba(232,163,61,0.05);
  }

  .drop input { display: none; }

  .drop-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 4px;
  }

  .drop-hint {
    font-size: 13px;
    color: var(--paper-dim);
  }

  .filename {
    margin-top: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--amber);
    word-break: break-all;
  }

  button.go {
    width: 100%;
    margin-top: 18px;
    background: var(--amber);
    color: var(--ink);
    border: none;
    border-radius: 8px;
    padding: 13px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  button.go:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  button.go:not(:disabled):hover { opacity: 0.88; }

  /* Waveform loading state — the signature element */
  .waveform {
    display: none;
    align-items: flex-end;
    justify-content: center;
    gap: 4px;
    height: 40px;
    margin: 18px 0 6px;
  }

  .waveform.active { display: flex; }

  .waveform span {
    width: 4px;
    background: var(--amber);
    border-radius: 2px;
    animation: bar 1.1s ease-in-out infinite;
  }

  .waveform span:nth-child(1) { height: 30%; animation-delay: 0s; }
  .waveform span:nth-child(2) { height: 60%; animation-delay: 0.1s; }
  .waveform span:nth-child(3) { height: 90%; animation-delay: 0.2s; }
  .waveform span:nth-child(4) { height: 45%; animation-delay: 0.3s; }
  .waveform span:nth-child(5) { height: 75%; animation-delay: 0.4s; }
  .waveform span:nth-child(6) { height: 35%; animation-delay: 0.5s; }
  .waveform span:nth-child(7) { height: 65%; animation-delay: 0.6s; }
  .waveform span:nth-child(8) { height: 20%; animation-delay: 0.7s; }

  @keyframes bar {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }

  .status-text {
    text-align: center;
    font-size: 13px;
    color: var(--paper-dim);
    font-family: 'IBM Plex Mono', monospace;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--amber);
    margin: 0 0 10px;
  }

  .summary-text {
    font-size: 15.5px;
    line-height: 1.65;
    color: var(--paper);
    margin: 0 0 22px;
  }

  ul.list {
    margin: 0 0 22px;
    padding: 0;
    list-style: none;
  }

  ul.list li {
    position: relative;
    padding-left: 22px;
    margin-bottom: 10px;
    font-size: 14.5px;
    line-height: 1.5;
  }

  ul.list.decisions li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 7px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--good);
  }

  .action-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 0;
    border-top: 1px solid var(--line);
    font-size: 14.5px;
  }

  .action-item:first-child { border-top: none; }

  .action-item .task { flex: 1; }

  .action-item .meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--paper-dim);
    white-space: nowrap;
    text-align: right;
  }

  .transcript-box {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
    color: var(--paper-dim);
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    max-height: 260px;
    overflow-y: auto;
    white-space: pre-wrap;
  }

  .error {
    background: rgba(200,80,80,0.1);
    border: 1px solid rgba(200,80,80,0.4);
    color: #E08585;
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 13.5px;
    margin-bottom: 20px;
    display: none;
  }

  .hidden { display: none; }

  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 14px;
    padding: 12px 0;
    border-top: 1px solid var(--line);
    cursor: pointer;
  }

  .history-item:first-child { border-top: none; }

  .history-item:hover .history-summary { color: var(--amber); }

  .history-summary {
    font-size: 14px;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: color 0.15s ease;
  }

  .history-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--paper-dim);
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="rec-dot"></div>
      <h1>Meeting Summarizer</h1>
    </header>
    <p class="sub">Upload a meeting recording. Get the transcript, key decisions, and action items back — automatically.</p>

    <div class="panel">
      <label class="drop" id="dropZone">
        <input type="file" id="fileInput" accept=".mp3,.wav,.m4a,.mp4,.mpeg,.mpga,.webm">
        <div class="drop-label" id="dropLabel">Click to choose an audio file</div>
        <div class="drop-hint">or drag &amp; drop — mp3, wav, m4a, mp4 (max 25MB)</div>
        <div class="filename" id="filename"></div>
      </label>

      <div class="waveform" id="waveform">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="status-text hidden" id="statusText">Transcribing audio…</div>

      <button class="go" id="goBtn" disabled>Summarize Meeting</button>
    </div>

    <div class="error" id="errorBox"></div>

    <div class="panel hidden" id="resultsPanel">
      <p class="eyebrow">Overview</p>
      <p class="summary-text" id="summaryText"></p>

      <p class="eyebrow">Key Decisions</p>
      <ul class="list decisions" id="decisionsList"></ul>

      <p class="eyebrow">Action Items</p>
      <div id="actionsList"></div>
    </div>

    <div class="panel hidden" id="transcriptPanel">
      <p class="eyebrow">Full Transcript</p>
      <div class="transcript-box" id="transcriptBox"></div>
    </div>

    <div class="panel" id="historyPanel">
      <p class="eyebrow">Past Meetings</p>
      <div id="historyList"><p style="color: var(--paper-dim); font-size: 13.5px;">Loading…</p></div>
    </div>
  </div>

<script>
  // Point this at your running backend (see backend/main.py).
  const API_BASE = "http://localhost:8000";
  const API_URL = `${API_BASE}/upload`;

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const dropLabel = document.getElementById('dropLabel');
  const filenameEl = document.getElementById('filename');
  const goBtn = document.getElementById('goBtn');
  const waveform = document.getElementById('waveform');
  const statusText = document.getElementById('statusText');
  const errorBox = document.getElementById('errorBox');
  const resultsPanel = document.getElementById('resultsPanel');
  const transcriptPanel = document.getElementById('transcriptPanel');

  let selectedFile = null;

  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) setFile(e.target.files[0]);
  });

  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag');
    if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
  });

  function setFile(file) {
    selectedFile = file;
    filenameEl.textContent = file.name;
    dropLabel.textContent = "Ready to summarize";
    goBtn.disabled = false;
  }

  goBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    errorBox.style.display = 'none';
    resultsPanel.classList.add('hidden');
    transcriptPanel.classList.add('hidden');
    waveform.classList.add('active');
    statusText.classList.remove('hidden');
    statusText.textContent = "Transcribing and summarizing…";
    goBtn.disabled = true;

    const formData = new FormData();
    formData.append('file', selectedFile);

    try {
      const res = await fetch(API_URL, { method: 'POST', body: formData });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.detail || 'Something went wrong processing the audio.');
      }

      renderResults(data);
      loadHistory();
    } catch (err) {
      errorBox.textContent = "Couldn't process that file: " + err.message;
      errorBox.style.display = 'block';
    } finally {
      waveform.classList.remove('active');
      statusText.classList.add('hidden');
      goBtn.disabled = false;
    }
  });

  async function loadHistory() {
    const historyList = document.getElementById('historyList');
    try {
      const res = await fetch(`${API_BASE}/meetings`);
      const meetings = await res.json();

      if (!res.ok) throw new Error('Could not load history.');

      if (!meetings.length) {
        historyList.innerHTML = '<p style="color: var(--paper-dim); font-size: 13.5px;">No meetings processed yet — upload one above.</p>';
        return;
      }

      historyList.innerHTML = '';
      meetings.forEach(m => {
        const row = document.createElement('div');
        row.className = 'history-item';
        const when = new Date(m.created_at).toLocaleString();
        row.innerHTML = `
          <div class="history-summary">${escapeHtml(m.summary || m.filename)}</div>
          <div class="history-meta">${escapeHtml(when)}</div>
        `;
        row.addEventListener('click', () => loadMeeting(m.id));
        historyList.appendChild(row);
      });
    } catch (err) {
      historyList.innerHTML = `<p style="color: var(--paper-dim); font-size: 13.5px;">Backend not reachable yet — start it and refresh.</p>`;
    }
  }

  async function loadMeeting(id) {
    try {
      const res = await fetch(`${API_BASE}/meetings/${id}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Could not load that meeting.');
      renderResults(data);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  }

  // Load history as soon as the page opens.
  loadHistory();

  function renderResults(data) {
    document.getElementById('summaryText').textContent = data.summary || "No summary generated.";

    const decisionsList = document.getElementById('decisionsList');
    decisionsList.innerHTML = '';
    if (data.key_decisions && data.key_decisions.length) {
      data.key_decisions.forEach(d => {
        const li = document.createElement('li');
        li.textContent = d;
        decisionsList.appendChild(li);
      });
    } else {
      decisionsList.innerHTML = '<li style="color: var(--paper-dim)">No explicit decisions detected.</li>';
    }

    const actionsList = document.getElementById('actionsList');
    actionsList.innerHTML = '';
    if (data.action_items && data.action_items.length) {
      data.action_items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'action-item';
        row.innerHTML = `
          <div class="task">${escapeHtml(item.task)}</div>
          <div class="meta">${escapeHtml(item.owner || 'Unassigned')}${item.due ? ' · ' + escapeHtml(item.due) : ''}</div>
        `;
        actionsList.appendChild(row);
      });
    } else {
      actionsList.innerHTML = '<p style="color: var(--paper-dim); font-size: 14px;">No action items detected.</p>';
    }

    document.getElementById('transcriptBox').textContent = data.transcript || '';

    resultsPanel.classList.remove('hidden');
    transcriptPanel.classList.remove('hidden');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
